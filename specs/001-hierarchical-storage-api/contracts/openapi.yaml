openapi: 3.1.0
info:
  title: Hierarchical Storage API
  version: 1.0.0
  description: >
    Backend API for tracking Spaces, recursive Containers, and Items in a
    physical storage hierarchy.
servers:
  - url: http://localhost:3000
paths:
  /spaces:
    get:
      summary: List spaces
      operationId: listSpaces
      responses:
        "200":
          description: Spaces returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceListResponse"
    post:
      summary: Create a space
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
      responses:
        "201":
          description: Space created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
  /spaces/{spaceId}:
    patch:
      summary: Update a space
      operationId: updateSpace
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: Space updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a space
      operationId: deleteSpace
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "204":
          description: Space deleted
        "404":
          $ref: "#/components/responses/Error"
  /spaces/{spaceId}/tree:
    get:
      summary: Get a full or depth-limited space tree
      operationId: getSpaceTree
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/Depth"
      responses:
        "200":
          description: Space tree returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeResponse"
        "404":
          $ref: "#/components/responses/Error"
  /containers:
    post:
      summary: Create a container
      operationId: createContainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContainerRequest"
      responses:
        "201":
          description: Container created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
  /containers/{containerId}:
    patch:
      summary: Update a container
      operationId: updateContainer
      parameters:
        - $ref: "#/components/parameters/ContainerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: Container updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /containers/{containerId}/tree:
    get:
      summary: Get a container subtree
      operationId: getContainerTree
      parameters:
        - $ref: "#/components/parameters/ContainerId"
        - $ref: "#/components/parameters/Depth"
      responses:
        "200":
          description: Container subtree returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeResponse"
        "404":
          $ref: "#/components/responses/Error"
  /containers/{containerId}/move:
    patch:
      summary: Move a container
      operationId: moveContainer
      parameters:
        - $ref: "#/components/parameters/ContainerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNodeRequest"
      responses:
        "200":
          description: Container moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /items:
    post:
      summary: Create an item
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
  /items/{itemId}:
    get:
      summary: Get an item
      operationId: getItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update an item
      operationId: updateItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /items/{itemId}/move:
    patch:
      summary: Move an item
      operationId: moveItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNodeRequest"
      responses:
        "200":
          description: Item moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /items/{itemId}/path:
    get:
      summary: Get the full item location path
      operationId: getItemPath
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item path returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPathResponse"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
    ContainerId:
      name: containerId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    Depth:
      name: depth
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 25
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    NodeType:
      type: string
      enum:
        - SPACE
        - CONTAINER
        - ITEM
    Node:
      type: object
      required:
        - id
        - type
        - name
        - parentId
        - spaceId
        - images
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/NodeType"
        name:
          type: string
        parentId:
          type:
            - string
            - "null"
        spaceId:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/NodeImage"
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TreeNode:
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/TreeNode"
    PathSegment:
      type: object
      required:
        - id
        - type
        - name
        - images
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/NodeType"
        name:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/NodeImage"
    NodeImage:
      type: object
      required:
        - id
        - url
        - sortOrder
        - createdAt
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        altText:
          type: string
        sortOrder:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    NodeImageInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        altText:
          type: string
        sortOrder:
          type: integer
          minimum: 0
    CreateSpaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/NodeImageInput"
    CreateContainerRequest:
      type: object
      required:
        - name
        - parentId
      properties:
        name:
          type: string
        parentId:
          type: string
          description: Space or Container parent identifier.
        metadata:
          type: object
          additionalProperties: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/NodeImageInput"
    CreateItemRequest:
      type: object
      required:
        - name
        - parentId
      properties:
        name:
          type: string
        parentId:
          type: string
          description: Space or Container parent identifier.
        metadata:
          type: object
          additionalProperties: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/NodeImageInput"
    UpdateNodeRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/NodeImageInput"
    MoveNodeRequest:
      type: object
      required:
        - parentId
      properties:
        parentId:
          type: string
          description: New Space or Container parent identifier.
    NodeResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Node"
    SpaceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Node"
    TreeResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/TreeNode"
    ItemPathResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - itemId
            - path
          properties:
            itemId:
              type: string
            path:
              type: array
              items:
                $ref: "#/components/schemas/PathSegment"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_MOVE
                - CIRCULAR_REFERENCE
                - NOT_FOUND
                - INVALID_PARENT_TYPE
                - SPACE_MISMATCH
                - VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
